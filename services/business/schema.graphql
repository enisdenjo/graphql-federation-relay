scalar _FieldSet

directive @key(fields: _FieldSet!) repeatable on OBJECT | INTERFACE

type Person implements Actor @key(fields: "id") {
  id: ID!
  name: String
  email: String
  profilePicture: Image
  joined: String
  location: Location
}

interface Actor @key(fields: "id") {
  id: ID!
  name: String
  profilePicture: Image
  joined: String
}

type Image {
  url(height: Int, width: Int): String!
  altText: String
}

type Location {
  id: ID!
  name: String!
}

type Organization implements Actor @key(fields: "id") {
  id: ID!
  name: String
  profilePicture: Image
  joined: String
  organizationKind: OrganizationKind
}

enum OrganizationKind {
  COMMERCIAL
  NONPROFIT
  GOVERNMENT
  JOURNALISTIC
}

type Story @key(fields: "id") {
  createdAt: String!
  id: ID!
  category: Category
  title: String!
  summary: String
  updatedAt: String
  attachments: [Image]
  poster: Actor!
  thumbnail: Image
  likeCount: Int
  doesViewerLike: Boolean
  comments(first: Int, after: String): CommentsConnection
}

enum Category {
  ALL
  EDUCATION
  NEWS
  COOKING
}

type CommentsConnection {
  edges: [CommentsConnectionEdge]
  pageInfo: PageInfo
}

type CommentsConnectionEdge {
  node: Comment
  cursor: String
}

type Comment {
  id: ID!
  text: String
}

type PageInfo {
  startCursor: String
  endCursor: String
  lastCursor: String
  hasNextPage: Boolean
  hasPreviousPage: Boolean
}

type Query {
  viewer: Viewer
  topStory(category: Category): Story
  topStories: [Story]
}

type Viewer {
  actor: Actor
  contacts(search: String): [Actor]
  newsfeedStories(
    first: Int
    after: String
    category: Category
  ): StoriesConnection
}

type StoriesConnection {
  edges: [StoriesConnectionEdge]
  pageInfo: PageInfo
}

type StoriesConnectionEdge {
  node: Story
  cursor: String
}

type Mutation {
  likeStory(id: ID!, doesLike: Boolean!): StoryMutationResponse
  postStoryComment(id: ID!, text: String!): StoryCommentMutationResponse
}

type StoryMutationResponse {
  story: Story
}

type StoryCommentMutationResponse {
  story: Story
  commentEdge: CommentsConnectionEdge
}
